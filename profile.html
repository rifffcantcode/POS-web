<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Saya | LUMINA</title>
    <link rel="stylesheet" href="css/profile.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-JS8rUMSRvri9Llb-"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              lumina: {
                dark: "#1a2a40",
                gold: "#d4af37",
                light: "#f8f9fa",
                text: "#2c3e50",
              },
            },
            fontFamily: { sans: ["Poppins", "sans-serif"] },
            animation: {
              "slide-in-right": "slideInRight 0.3s ease-out forwards",
              "fade-in": "fadeIn 0.5s ease-out forwards",
            },
            keyframes: {
              slideInRight: {
                "0%": { transform: "translateX(100%)" },
                "100%": { transform: "translateX(0)" },
              },
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <nav
      class="bg-lumina-dark text-white shadow-lg sticky top-0 z-50 h-[76px] flex items-center"
    >
      <div
        class="container mx-auto px-6 flex justify-between items-center w-full"
      >
        <h1
          class="flex items-center gap-2 text-2xl font-black tracking-[0.1em] text-lumina-gold uppercase"
        >
          <i class="fa-solid fa-couch text-xxl"></i>
          <span>LUMINA</span>
        </h1>

        <div class="flex items-center gap-6">
          <a
            href="landing.html"
            class="text-sm font-bold hover:text-lumina-gold transition flex items-center gap-2"
          >
            <i class="fas fa-arrow-left"></i> Kembali
          </a>
        </div>
      </div>
    </nav>

    <div class="container mx-auto px-4 py-10 max-w-5xl animate-profile">
      <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-8 relative">
        <div class="h-32 bg-lumina-dark relative">
          <div
            class="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?q=80&w=1632&auto=format&fit=crop')] bg-cover bg-center"
          ></div>
        </div>
        <div class="px-8 pb-8 pt-0 flex flex-col md:flex-row items-center md:items-end gap-6 relative -mt-16">
  <div
    id="profile-initial"
    class="w-32 h-32 bg-lumina-gold text-lumina-dark text-5xl font-black rounded-full border-4 border-white flex items-center justify-center shadow-lg relative z-10"
  >
    <i class="fas fa-spinner fa-spin text-2xl"></i>
  </div>

  <div class="flex-1 text-center md:text-left pt-16 md:pt-0 pb-2">
    <h2 id="profile-name" class="text-3xl font-bold text-gray-800">
      Memuat Data...
    </h2>
    <p id="profile-email" class="text-gray-500 font-medium"></p>
  </div>

  <div class="flex items-center gap-3 pb-2">
    <button
      onclick="openEditModal()"
      class="flex items-center gap-2 px-5 py-2 text-sm font-bold text-lumina-gold hover:bg-lumina-gold/10 rounded-full transition border border-lumina-gold/20"
    >
      <i class="fas fa-edit"></i> Edit Profil
    </button>

    <button
      onclick="handleLogout()"
      class="bg-red-50 text-red-600 px-6 py-2 rounded-full font-bold hover:bg-red-600 hover:text-white transition shadow-sm border border-red-100 flex items-center gap-2 text-sm"
    >
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
  </div>
</div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="md:col-span-1">
          <div class="bg-white rounded-3xl shadow-xl p-8 h-full">
            <h3
              class="text-lg font-black tracking-tight text-lumina-dark uppercase mb-6 flex items-center gap-2"
            >
              <i class="fas fa-id-card text-lumina-gold"></i> Detail Pengiriman
            </h3>
            <div class="space-y-6">
              <div>
                <label
                  class="block text-[10px] font-bold text-gray-400 uppercase mb-1"
                  >Nomor Telepon</label
                >
                <div
                  class="flex items-center gap-3 text-gray-700 bg-gray-50 p-3 rounded-xl border border-gray-100"
                >
                  <i
                    class="fas fa-phone-alt text-lumina-gold w-5 text-center"
                  ></i>
                  <span id="profile-phone" class="font-medium text-sm"
                    >Memuat...</span
                  >
                </div>
              </div>
              <div>
                <label
                  class="block text-[10px] font-bold text-gray-400 uppercase mb-1"
                  >Alamat Lengkap</label
                >
                <div
                  class="flex items-start gap-3 text-gray-700 bg-gray-50 p-3 rounded-xl border border-gray-100 min-h-[100px]"
                >
                  <i
                    class="fas fa-map-marker-alt text-lumina-gold w-5 text-center mt-1"
                  ></i>
                  <span
                    id="profile-address"
                    class="font-medium text-sm leading-relaxed"
                    >Memuat...</span
                  >
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="md:col-span-2">
          <div class="bg-white rounded-3xl shadow-xl p-8 h-full">
            <h3
              class="text-lg font-black tracking-tight text-lumina-dark uppercase mb-6 flex items-center gap-2"
            >
              <i class="fas fa-shopping-bag text-lumina-gold"></i> Riwayat
              Transaksi
            </h3>

            <div id="order-history" class="space-y-4">
              <div class="text-center py-10 text-gray-400">
                <i
                  class="fas fa-circle-notch fa-spin text-3xl mb-3 text-lumina-gold"
                ></i>
                <p class="text-sm">Menarik data dari database...</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="edit-modal"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl animate-fade-in"
      >
        <div
          class="bg-lumina-dark p-6 text-white flex justify-between items-center"
        >
          <h3 class="text-xl font-bold tracking-tight">
            <i class="fas fa-user-edit text-lumina-gold mr-2"></i> Edit Profil
          </h3>
          <button
            onclick="toggleEditModal()"
            class="text-gray-400 hover:text-white transition"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form id="edit-profile-form" class="p-8 space-y-5">
          <div>
            <label
              class="block text-[10px] font-bold text-gray-400 uppercase mb-2"
              >Nama Lengkap</label
            >
            <input
              type="text"
              id="edit-name"
              class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-lumina-gold focus:ring-1 focus:ring-lumina-gold outline-none transition"
              required
            />
          </div>
          <div>
            <label
              class="block text-[10px] font-bold text-gray-400 uppercase mb-2"
              >Nomor Telepon</label
            >
            <input
              type="tel"
              id="edit-phone"
              class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-lumina-gold focus:ring-1 focus:ring-lumina-gold outline-none transition"
              required
            />
          </div>
          <div>
            <label
              class="block text-[10px] font-bold text-gray-400 uppercase mb-2"
              >Alamat Lengkap</label
            >
            <textarea
              id="edit-address"
              rows="3"
              class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:border-lumina-gold focus:ring-1 focus:ring-lumina-gold outline-none transition"
              required
            ></textarea>
          </div>
          <div class="pt-4 flex gap-3">
            <button
              type="button"
              onclick="toggleEditModal()"
              class="flex-1 px-6 py-3 rounded-xl border border-gray-200 text-sm font-bold text-gray-500 hover:bg-gray-50 transition"
            >
              Batal
            </button>
            <button
              type="submit"
              class="flex-1 bg-lumina-gold text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-lumina-gold-dark transition shadow-lg shadow-lumina-gold/20"
            >
              Simpan Perubahan
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="js/profile.js"></script>
  </body>
</html>
