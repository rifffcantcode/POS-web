<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pengguna - LUMINA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0c1a32; color: white; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 bg-slate-800 p-6 rounded-2xl border-l-4 border-yellow-400">
            <div>
                <h1 class="text-2xl font-black text-yellow-400 uppercase tracking-wider">Profil Member</h1>
                <p id="user-email" class="text-slate-400">Memuat email...</p>
            </div>
            <button onclick="location.href='index.html'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition">
                Kembali ke Kasir
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-800 p-6 rounded-2xl text-center">
                <p class="text-slate-400 text-sm uppercase">Total Belanja</p>
                <h2 id="total-spent" class="text-3xl font-bold text-white mt-2">Rp 0</h2>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl text-center">
                <p class="text-slate-400 text-sm uppercase">Jumlah Transaksi</p>
                <h2 id="trx-count" class="text-3xl font-bold text-white mt-2">0</h2>
            </div>
        </div>

        <div class="bg-slate-800 rounded-2xl overflow-hidden">
            <div class="p-5 border-b border-slate-700 font-bold text-lg">Riwayat Belanja Terakhir</div>
            <div id="history-list" class="divide-y divide-slate-700">
                <p class="p-10 text-center text-slate-500">Mencari data transaksi...</p>
            </div>
        </div>
    </div>

    <script type="module" src="/js/profile.js"></script>
</body>
</html>
