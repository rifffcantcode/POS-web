<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div
  id="receipt-modal"
  class="fixed inset-0 hidden items-center justify-center p-4 backdrop-blur-sm"
  style="z-index: 9999;"
>
      <div
        class="bg-white w-full max-w-sm rounded-lg shadow-2xl overflow-hidden animate-fade-in"
      >
        <div
          id="receipt-print-area"
          class="p-6 bg-white text-gray-800 font-mono text-xs"
        >
          <div class="text-center border-b-2 border-dashed pb-4 mb-4">
            <h2 class="text-2xl font-bold tracking-tighter">LUMINA</h2>
            <p class="text-[10px] uppercase">Luxury Furniture & Living</p>
            <p class="text-[10px] mt-1" id="receipt-date"></p>
          </div>
          <div class="space-y-1 mb-4">
            <div class="flex justify-between">
              <span>No. TRX:</span
              ><span id="receipt-trx-id" class="font-bold"></span>
            </div>
            <div class="flex justify-between">
              <span>Kasir:</span><span>Admin Lumina</span>
            </div>
          </div>
          <table class="w-full mb-4 border-b border-dashed">
            <thead>
              <tr class="border-b border-dashed">
                <th class="text-left py-2">Item</th>
                <th class="text-center py-2">Qty</th>
                <th class="text-right py-2">Total</th>
              </tr>
            </thead>
            <tbody
              id="receipt-items-list"
              class="divide-y divide-gray-50"
            ></tbody>
          </table>
          <div class="pt-2 space-y-1">
            <div class="flex justify-between font-bold text-base">
              <span>TOTAL</span><span id="receipt-total"></span>
            </div>
          </div>
          <div class="text-center mt-6 pt-4 border-t border-gray-100">
            <p class="text-[10px]">Terima kasih atas kunjungan Anda</p>
          </div>
        </div>
     <div class="p-4 bg-gray-50 flex gap-2">
    <button
        onclick="printStruk()"
        class="flex-1 bg-lumina-dark text-white py-2 rounded-lg font-bold hover:bg-gray-800 transition"
    >
        🖨️ Cetak Struk
    </button>

    <button
        onclick="finishTransaction()"
        class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-bold hover:bg-gray-300 transition"
    >
        🏠 Kembali
    </button>
</div>
      </div>
    </div>
</body>
</html>
