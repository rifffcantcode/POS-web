<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Penjualan - LUMINA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "lumina-dark": "#1D2939",
              "lumina-gold": "#D4AF37",
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
      }
      .card-shadow {
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 10px -6px rgba(0, 0, 0, 0.05);
      }
      #topProductsChart {
        margin: 6px auto 0;
        max-width: 96%;
        max-height: 96%;
        display: block;
      }

      /* Hilangkan animasi pada card khusus saat loading awal */
      .card-no-transition {
        transition: none !important;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <nav
      class="bg-[#1e293b] text-white py-4 px-8 flex justify-between items-center shadow-md"
    >
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-3">
          <i class="fas fa-chart-line text-lumina-gold text-xl"></i>
          <h1
            class="text-2xl font-black tracking-widest text-lumina-gold cursor-pointer"
            onclick="location.reload()"
          >
            LUMINA
            <span class="text-gray-300 font-light ml-1">ADMIN</span>
          </h1>
        </div>

        <div class="h-6 w-[1px] bg-gray-700"></div>

        <a
          href="landing.html"
          class="bg-gray-800/50 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-gray-300 hover:text-white transition text-xs flex items-center gap-2 border border-gray-700"
        >
          <i class="fas fa-arrow-left text-[10px]"></i> Ke Landing Page
        </a>
      </div>
    </nav>

    <main class="p-8 max-w-7xl mx-auto">
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 mb-10 no-print"
      >
        <select
          id="period-filter"
          class="bg-white border border-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm focus:ring-2 focus:ring-lumina-gold outline-none cursor-pointer"
        >
          <option value="all">Semua Waktu</option>
          <option value="today">Hari Ini</option>
          <option value="week">7 Hari Terakhir</option>
          <option value="month">30 Hari Terakhir</option>
        </select>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div
          class="bg-lumina-dark p-8 rounded-[2rem] card-shadow relative overflow-hidden"
        >
          <div class="relative z-10">
            <div class="flex justify-between items-start mb-6">
              <div class="bg-lumina-gold/20 p-3 rounded-2xl">
                <i class="fas fa-wallet text-lumina-gold text-xl"></i>
              </div>
              <span
                class="text-[10px] bg-green-500/20 text-green-400 px-3 py-1 rounded-full font-black tracking-widest uppercase"
                >Live</span
              >
            </div>
            <p
              class="text-white/50 text-xs font-bold uppercase tracking-widest"
            >
              Total Omzet
            </p>
            <h2 id="total-revenue" class="text-4xl font-black text-white mt-2">
              Rp 0
            </h2>
          </div>
          <i
            class="fas fa-chart-line absolute -right-6 -bottom-6 text-white/5 text-9xl"
          ></i>
        </div>

        <div
          class="bg-white p-8 rounded-[2rem] card-shadow border border-slate-100"
        >
          <div class="bg-blue-50 w-fit p-4 rounded-2xl mb-4">
            <i class="fas fa-shopping-cart text-blue-600 text-2xl"></i>
          </div>
          <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">
            Transaksi
          </p>
          <h2 id="total-orders" class="text-4xl font-black text-slate-800 mt-2">
            0
          </h2>
        </div>

        <div
          class="bg-white p-8 rounded-[2rem] card-shadow border border-slate-100"
        >
          <div class="bg-orange-50 w-fit p-4 rounded-2xl mb-4">
            <i class="fas fa-couch text-orange-600 text-2xl"></i>
          </div>
          <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">
            Produk Terjual
          </p>
          <h2 id="total-items" class="text-4xl font-black text-slate-800 mt-2">
            0
          </h2>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10 no-print">
        <div
          class="lg:col-span-2 bg-white p-8 rounded-[2rem] card-shadow border border-slate-100"
        >
          <h3
            class="font-bold text-slate-800 text-lg mb-8 flex items-center gap-3"
          >
            <i class="fas fa-chart-line text-lumina-gold"></i> Tren Penjualan
          </h3>
          <div class="h-[350px] w-full">
            <canvas id="salesChart"></canvas>
          </div>
        </div>

        <div
          class="bg-white p-8 rounded-[2rem] card-shadow border border-slate-100"
        >
          <h3
            class="font-bold text-slate-800 text-lg mb-8 flex items-center gap-3"
          >
            <i class="fas fa-crown text-lumina-gold"></i> Produk Terlaris
          </h3>
          <div class="h-[320px] w-full relative overflow-hidden block">
            <canvas id="topProductsChart"></canvas>
          </div>
          <div id="top-products-legend" class="mt-4 flex flex-wrap justify-center gap-x-5 gap-y-2 text-xs text-slate-600 font-medium"></div>
        </div>
      </div>
      

        <!-- Tabs Section -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-8">
          <div class="flex border-b border-slate-200">
            <button
              class="flex-1 px-6 py-4 text-center font-bold text-lumina-dark border-b-2 border-lumina-gold bg-lumina-light/30"
              data-tab="report"
            >
              <i class="fas fa-chart-bar mr-2"></i>Laporan Penjualan
            </button>
            <button
              class="flex-1 px-6 py-4 text-center font-bold text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition"
              data-tab="users"
            >
              <i class="fas fa-users mr-2"></i>Manajemen User
            </button>
          </div>

          <!-- Report Tab -->
          <div id="report-tab" class="p-6">
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-lg font-bold text-lumina-dark">
                Daftar Transaksi
              </h3>
              <button
                id="export-pdf-btn"
                class="px-4 py-2 bg-lumina-dark text-lumina-gold rounded-lg font-bold text-sm hover:bg-[#243447] transition flex items-center gap-2"
              >
                <i class="fas fa-file-pdf text-sm"></i> Ekspor PDF
              </button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead>
                  <tr class="border-b border-slate-200">
                    <th
                      class="px-8 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider"
                    >
                      Waktu
                    </th>
                    <th
                      class="px-8 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider"
                    >
                      ID Pesanan
                    </th>
                    <th
                      class="px-8 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider"
                    >
                      Item
                    </th>
                    <th
                      class="px-8 py-3 text-right text-xs font-bold text-slate-600 uppercase tracking-wider"
                    >
                      Total
                    </th>
                  </tr>
                </thead>
                <tbody id="report-table-body">
                  <tr>
                    <td
                      colspan="4"
                      class="px-8 py-10 text-center text-slate-400 text-sm font-medium"
                    >
                      Loading...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div
              id="report-pagination"
              class="mt-6 flex items-center justify-between"
            ></div>
          </div>

          <!-- Users Tab -->
          <div id="users-tab" class="p-6 hidden">
            <h3 class="text-lg font-bold text-lumina-dark mb-6">
              Manajemen Role User
            </h3>
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead>
                  <tr class="border-b border-slate-200">
                    <th
                      class="px-8 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider"
                    >
                      Nama
                    </th>
                    <th
                      class="px-8 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider"
                    >
                      Email
                    </th>
                    <th
                      class="px-8 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider"
                    >
                      Role Saat Ini
                    </th>
                    <th
                      class="px-8 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider"
                    >
                      Ubah Role
                    </th>
                    <th
                      class="px-8 py-3 text-right text-xs font-bold text-slate-600 uppercase tracking-wider"
                    >
                      Aksi
                    </th>
                  </tr>
                </thead>
                <tbody id="role-user-table-body">
                  <tr>
                    <td
                      colspan="5"
                      class="px-8 py-10 text-center text-slate-400 text-sm font-medium"
                    >
                      Loading...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

    </main>

    <script type="module" src="js/admin.js"></script>
    <script>
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", function () {
          const tabName = this.dataset.tab;

          // Hide all tabs
          document.getElementById("report-tab").classList.add("hidden");
          document.getElementById("users-tab").classList.add("hidden");

          // Remove active styles from all buttons
          document.querySelectorAll("[data-tab]").forEach((btn) => {
            btn.classList.remove(
              "border-b-2",
              "border-lumina-gold",
              "bg-lumina-light/30",
              "text-lumina-dark",
            );
            btn.classList.add(
              "border-b-2",
              "border-transparent",
              "text-slate-500",
              "hover:text-slate-700",
            );
          });

          // Show selected tab
          document.getElementById(tabName + "-tab").classList.remove("hidden");

          // Add active styles to clicked button
          this.classList.remove(
            "border-b-2",
            "border-transparent",
            "text-slate-500",
            "hover:text-slate-700",
          );
          this.classList.add(
            "border-b-2",
            "border-lumina-gold",
            "bg-lumina-light/30",
            "text-lumina-dark",
          );
        });
      });
    </script>
  </body>
</html>
