<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Tidur - LUMINA Modern Furniture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'lumina-dark': '#0f172a',
            'lumina-gold': '#b99470',
            'lumina-light': '#f8fafc',
          },
          fontFamily: { 'sans': ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-white font-sans text-lumina-dark">

  <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-gray-100">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="landing.html" class="text-2xl font-bold tracking-tighter text-lumina-dark">LUMINA<span class="text-lumina-gold">.</span></a>
      <div class="flex items-center gap-6">
        <a href="landing.html" class="text-sm font-semibold hover:text-lumina-gold transition">Beranda</a>
        <button onclick="openCart()" class="relative p-2">
          <i class="fa-solid fa-bag-shopping text-xl"></i>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-lumina-gold text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
        </button>
      </div>
    </div>
  </nav>

  <header class="pt-32 pb-16 bg-lumina-light">
    <div class="container mx-auto px-6">
      <div class="max-w-3xl">
        <nav class="flex text-sm text-gray-400 mb-4 font-medium">
          <a href="landing.html" class="hover:text-lumina-gold">Beranda</a>
          <span class="mx-2">/</span>
          <span class="text-lumina-dark">Ruang Tidur</span>
        </nav>
        <h1 class="text-5xl font-bold mb-4">Ruang Tidur</h1>
        <p class="text-gray-500 text-lg leading-relaxed">
          Hadirkan kenyamanan dan sentuhan penuh cinta di ruang personal Anda. #pastiketemu di ruang tidur impian.
        </p>
      </div>
    </div>
  </header>

  <section class="py-16">
    <div class="container mx-auto px-6">
      <div class="flex justify-between items-center mb-10 pb-6 border-b border-gray-100">
        <p class="text-sm text-gray-500">Menampilkan produk untuk <span class="font-bold text-lumina-dark">"Ruang Tidur"</span></p>
        <select class="text-sm border-none focus:ring-0 font-semibold cursor-pointer">
          <option>Terbaru</option>
          <option>Harga Terendah</option>
          <option>Harga Tertinggi</option>
        </select>
      </div>

      <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
        </div>
    </div>
  </section>

  <div id="cart-modal" class="fixed inset-0 bg-black/50 z-[100] hidden backdrop-blur-sm transition-all">
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
      <div class="p-6 border-b flex justify-between items-center">
        <h3 class="text-xl font-bold">Keranjang Saya</h3>
        <button onclick="closeCart()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-2xl"></i></button>
      </div>
      <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
        </div>
      <div class="p-6 border-t bg-gray-50">
        <div class="flex justify-between mb-4">
          <span class="text-gray-500 font-medium">Total Estimasi</span>
          <span id="cart-total" class="text-xl font-bold text-lumina-dark">Rp 0</span>
        </div>
        <button class="w-full bg-lumina-dark text-white py-4 rounded-xl font-bold hover:bg-gray-800 transition">Checkout Sekarang</button>
      </div>
    </div>
  </div>

<script type="module">
  // Perhatikan: Kita sekarang mengimpor dari "firebase-firestore.js"
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
     apiKey: "AIzaSyBMsUhXj-UCLLviXzweS1qXVdSaVgkDcu8",
     authDomain: "sistemkasirtokocom.firebaseapp.com",
     projectId: "sistemkasirtokocom",
     storageBucket: "sistemkasirtokocom.firebasestorage.app",
     messagingSenderId: "141722200955",
     appId: "1:141722200955:web:e07952808590aa7f582bde",
  };

  // Inisialisasi Firebase & Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allProducts = [];
  let cart = [];

  // --- LOGIKA KERANJANG (Anti-Error) ---
  try {
    const savedCart = localStorage.getItem("customer_cart");
    if (savedCart) {
      cart = JSON.parse(savedCart);
      cart = cart.map(item => ({
          ...item, 
          qty: Number(item.qty) || 1, 
          price: Number(item.price) || 0 
      }));
    }
  } catch (e) {
    localStorage.removeItem("customer_cart");
    cart = [];
  }

  // --- 1. AMBIL DATA DARI FIRESTORE (UPDATED) ---
  async function fetchProducts() {
    const grid = document.getElementById("product-grid");
    
    try {
      // Mengambil collection "products" dari Firestore
      const querySnapshot = await getDocs(collection(db, "products"));
      
      allProducts = [];
      querySnapshot.forEach((doc) => {
        // Menggabungkan ID dokumen dengan datanya
        allProducts.push({ id: doc.id, ...doc.data() });
      });

      console.log("Total Produk dari Firestore:", allProducts.length);

      // Filter Kategori "Ruang Tidur"
      const categoryData = allProducts.filter(p => {
          const productCat = p.category ? p.category.trim() : "";
          // Pastikan isDeleted dicek (jika fieldnya ada)
          const isNotDeleted = p.isDeleted !== true; 
          
          return productCat === "Ruang Tidur" && isNotDeleted;
      });

      if (categoryData.length === 0) {
          grid.innerHTML = `
              <div class="col-span-full text-center py-20">
                  <i class="fas fa-bed text-6xl text-gray-200 mb-4"></i>
                  <p class="text-gray-400 text-lg">Belum ada produk di kategori "Ruang Tidur".</p>
              </div>
          `;
      } else {
          renderProducts(categoryData);
      }

    } catch (error) {
      console.error("Gagal mengambil data:", error);
      grid.innerHTML = `<p class="col-span-full text-center text-red-400">Terjadi kesalahan koneksi database.<br><span class="text-xs text-gray-400">${error.message}</span></p>`;
    }
  }

  // --- 2. RENDER PRODUK ---
  function renderProducts(products) {
    const grid = document.getElementById("product-grid");
    grid.innerHTML = products.map(p => `
      <div class="group bg-white rounded-2xl border border-gray-100 p-4 hover:shadow-xl transition duration-300 flex flex-col">
        <div class="relative overflow-hidden rounded-xl h-64 bg-gray-50 mb-4">
          <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" 
               onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
        </div>
        <h4 class="font-bold text-lg mb-1 line-clamp-2">${p.name}</h4>
        <p class="text-lumina-gold font-bold mb-4">Rp ${Number(p.price).toLocaleString()}</p>
        <div class="mt-auto">
           <button onclick="addToCart('${p.id}', '${p.name}', ${p.price}, '${p.image}')" 
              class="w-full py-3 rounded-xl border-2 border-lumina-dark font-bold hover:bg-lumina-dark hover:text-white transition">
              Tambah ke Bag
           </button>
        </div>
      </div>
    `).join('');
  }

  // --- 3. FUNGSI KERANJANG ---
  window.addToCart = (id, name, price, image) => {
    const existing = cart.find(item => item.id === id);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ id, name, price, image, qty: 1 });
    }
    updateCart();
    openCart();
  };

  function updateCart() {
    localStorage.setItem("customer_cart", JSON.stringify(cart));
    const count = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
    document.getElementById("cart-count").innerText = count;
    
    const cartItems = document.getElementById("cart-items");
    if (cart.length === 0) {
      cartItems.innerHTML = `<p class="text-center text-gray-400 py-10">Keranjang kosong</p>`;
    } else {
      cartItems.innerHTML = cart.map((item, index) => `
        <div class="flex gap-4 items-center bg-gray-50 p-3 rounded-xl animate-fade-in">
          <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg">
          <div class="flex-1">
            <h5 class="text-sm font-bold line-clamp-1">${item.name}</h5>
            <p class="text-xs text-gray-500">${item.qty} x Rp ${Number(item.price).toLocaleString()}</p>
          </div>
          <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600 px-2 transition">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      `).join('');
    }
    const total = cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
    document.getElementById("cart-total").innerText = `Rp ${total.toLocaleString()}`;
  }

  window.removeFromCart = (index) => {
    cart.splice(index, 1);
    updateCart();
  };

  window.openCart = () => document.getElementById("cart-modal").classList.remove("hidden");
  window.closeCart = () => document.getElementById("cart-modal").classList.add("hidden");

  // Jalankan fungsi
  fetchProducts();
  updateCart();
</script>
</body>
</html>
